[project]
name = "finding-donors-project"
version = "0.1.0"
description = "Finding Donors for CharityML Project"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = [
    "ipykernel>=7.1.0",
    "nbconvert>=7.17.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
]


[project.urls]
Homepage = "https://github.com/simonerigoni/finding_donors_project"
Repository = "https://github.com/simonerigoni/finding_donors_project"
Website = "https://www.simonerigoni.net/blog/finding-donors-for-charityml-project"
Medium = "https://medium.com/data-science/finding-donors-for-charityml-project-e0f4a59dcea0"
Blogspot = "https://simonerigoni01.blogspot.com/2024/05/ricerca-di-donatori-per-il-progetto.html"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
